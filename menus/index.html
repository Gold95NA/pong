<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/home.css">
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
</head>
<body>
    <nav><a href="index.html">HOME</a></nav>
    <main>
        <section class="blank"></section>
        <section id="content">
            <div id="menus">
            <!-- This is what your final HMTL will look like.
                <div id="start-options">
                    <button data-load="false">New Game</button> NOTE: Will redirect to lobby.html and send load=false
                    <button data-load="true">Continue</button> NOTE: Will redirect to lobby.html and send load=true
                    <button>High Scores</button> NOTE: Will redirect to hs.html
                </div>
            -->
            </div>
        </section>
        <section class="blank"></section>
    </main>
    <script src="js/User.js"></script>
    <script>
        
        var menus = document.querySelector(`#menus`);

        // loading icon code
        const loadDiv = document.createElement(`div`);
        loadDiv.setAttribute(`id`, `load`);
        menus.appendChild(loadDiv);

        const startMenu = document.createElement(`div`);
        startMenu.setAttribute(`id`, `start-options`);
        startMenu.style.opacity = `0`;

        const startButton = document.createElement(`button`);
        startButton.appendChild(document.createTextNode(`Start`));
        startMenu.appendChild(startButton);

        var timer = setTimeout(loadStartMenu, 1000);
        function loadStartMenu() 
        {
            $(`#load`).animate({ opacity: 0 }, 2000, function() 
            {
                menus.removeChild(loadDiv);
                menus.appendChild(startMenu);
                $(`#start-options`).animate({ opacity: 1 }, 2000);
            });
        }

        startButton.addEventListener(`click`, function(e) 
        {
            $(`#start-options`).animate({ opacity: 0 }, 1000, function() 
            {
                menus.removeChild(startMenu);
        
                const newMenu = document.createElement(`div`);
                newMenu.setAttribute(`id`, `new-menu`);
                newMenu.style.opacity = `0`;

                const newGameButton = document.createElement(`button`);
                newGameButton.appendChild(document.createTextNode(`New Game`));
                newGameButton.setAttribute(`data-load`, `false`);

                const continueButton = document.createElement(`button`);
                continueButton.appendChild(document.createTextNode(`Continue`));
                continueButton.setAttribute(`data-load`, `true`);

                const highScoresButton = document.createElement(`button`);
                highScoresButton.appendChild(document.createTextNode(`High Scores`));

                newMenu.appendChild(newGameButton);
                newMenu.appendChild(continueButton);
                newMenu.appendChild(highScoresButton);

                menus.appendChild(newMenu);

                $(`#new-menu`).animate({ opacity: 1 }, 2000);

                newGameButton.addEventListener(`click`, function() 
                {
                    window.location.href = `lobby.html?load=false`;
                });

                continueButton.addEventListener(`click`, function() 
                {
                    window.location.href = `lobby.html?load=true`;
                });

                highScoresButton.addEventListener(`click`, function() 
                {
                    window.location.href = `hs.html`;
                });
            });
        });
        
    </script>
</body>
</html>
